name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies & Build SDL3
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev build-essential cmake git libfreetype6-dev

          # Bygg og installer SDL3
          git clone https://github.com/libsdl-org/SDL.git --depth 1
          cd SDL && mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          sudo make install
          cd ../..

          # Bygg og installer SDL3_ttf
          git clone https://github.com/libsdl-org/SDL_ttf.git --depth 1
          cd SDL_ttf && mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          sudo make install
          cd ../..

          # Oppdater biblioteksstier
          sudo ldconfig

      - name: Build project and run tests
        run: |
          # Legg til dine egne kompilering/test-kommandoer her, f.eks:
          # cmake -B build
          # cmake --build build
          # ctest --test-dir build
