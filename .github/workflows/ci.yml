name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libsdl3-dev libsdl3-ttf-dev
      - name: Run CLI and GUI tests
        run: make test test-gui
      - name: Run sanitizers
        run: make test-sanitize
