name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libsodium-dev \
            pkg-config

      - name: Install SDL3 and SDL3_ttf
        id: sdl
        uses: libsdl-org/setup-sdl@main
        with:
          install-linux-dependencies: true
          version: 3-latest
          version-sdl-ttf: 3-latest
          build-type: Release
          add-to-environment: true

      - name: Build and run CLI and GUI tests
        env:
          SDL3_PREFIX: ${{ steps.sdl.outputs.prefix }}
        run: make test test-gui

      - name: Run sanitizer tests
        run: make test-sanitize
